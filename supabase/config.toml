# Supabase local development configuration

[api]
port = 54321
db_port = 54322
test_db_port = 54323

[db]
port = 54322
shadow_port = 54323
major_version = 15

[studio]
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = false  # Set to true and add client_id/secret for local Google OAuth testing

[storage]
enabled = true
file_size_limit = "50MiB"

[functions]
# No edge functions in this project

[analytics]
enabled = false
