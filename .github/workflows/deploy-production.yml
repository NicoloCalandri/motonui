name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  apply-migrations:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations to production
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy, apply-migrations]
    if: always()
    steps:
      - name: Notify deployment status
        if: ${{ vars.SLACK_WEBHOOK_URL != '' }}
        run: |
          STATUS=${{ needs.deploy.result == 'success' && needs.apply-migrations.result == 'success' && '✅ Deploy riuscito' || '❌ Deploy fallito' }}
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"motonui production: $STATUS — ${{ github.sha }}\"}" \
            ${{ vars.SLACK_WEBHOOK_URL }}
