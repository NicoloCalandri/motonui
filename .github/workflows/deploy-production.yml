name: Deploy — Production

# T-4.1: production only receives a commit of main whose CI run is green.
# The workflow starts when the CI workflow completes and does nothing unless
# that run succeeded on a push to main; it deploys exactly the commit CI
# tested (workflow_run.head_sha), never a newer one. Migrations run first, so
# new code never meets an old schema; if they fail, the code is not deployed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Pinned tool versions: bumped by Dependabot PRs or by hand, never "latest".
  SUPABASE_CLI_VERSION: '2.119.0'
  VERCEL_CLI_VERSION: '62.4.0'
  NODE_VERSION: '20'

jobs:
  gate:
    name: Gate (CI green on main)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Commit to deploy
        run: echo "Deploying ${{ github.event.workflow_run.head_sha }} (CI run ${{ github.event.workflow_run.id }})"

  apply-migrations:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    needs: [gate]
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply migrations to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set on the production environment"
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    needs: [gate, apply-migrations]
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Official Vercel CLI at a fixed version: the token no longer goes to a
      # third-party action (SR-SDLC-07).
      - name: Build and deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set on the production environment"
            exit 1
          fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [gate, apply-migrations, deploy]
    if: always() && needs.gate.result == 'success'
    steps:
      - name: Notify deployment status
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          STATUS: ${{ needs.apply-migrations.result == 'success' && needs.deploy.result == 'success' && '✅ Deploy riuscito' || '❌ Deploy fallito' }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"motonui production: ${STATUS} — ${SHA}\"}" \
            "$SLACK_WEBHOOK_URL"
