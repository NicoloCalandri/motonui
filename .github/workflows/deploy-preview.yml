name: Deploy — Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: '62.4.0'
  NODE_VERSION: '20'

jobs:
  preview:
    name: Vercel Preview Deployment
    runs-on: ubuntu-latest
    environment: staging
    # Fork PRs get no secrets: skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Official Vercel CLI at a fixed version instead of a third-party action
      # holding the token (SR-SDLC-07). No token configured: nothing to do.
      - name: Deploy preview
        id: deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set: preview skipped"
            exit 0
          fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --token="$VERCEL_TOKEN"
          url=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview-url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.preview-url != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🏝️ **motonui preview deployed!**\n\n🔗 ${process.env.PREVIEW_URL}`,
            });
